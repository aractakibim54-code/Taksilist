<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ön Ambar Mesai Çıkış Paneli</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #070a18;
      --glass: rgba(255,255,255,0.055);
      --glass-strong: rgba(255,255,255,0.10);
      --glass-border: rgba(255,225,150,0.16);
      --glass-border-strong: rgba(255,225,150,0.26);
      --navy-mid: #16213f;
      --navy-deep: #0a1226;
      --gold: #fbbf24;
      --gold-bright: #ffd668;
      --gold-deep: #c9910f;
      --text-main: #f8f5eb;
      --text-muted: #9aa3c4;
      --text-on-gold: #1c1404;
      --r-lg: 24px;
      --r-xl: 28px;
      --r-pill: 999px;
      --shadow-deep: 0 24px 60px -24px rgba(0,0,0,0.75);
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      padding: calc(28px + var(--safe-t)) 20px calc(28px + var(--safe-b));
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column;
    }

    body::before {
      content: ""; position: fixed; inset: 0; z-index: -2;
      background:
        radial-gradient(circle at 12% 6%, rgba(251,191,36,.16), transparent 42%),
        radial-gradient(circle at 88% 16%, rgba(30,64,110,.35), transparent 40%),
        radial-gradient(circle at 25% 95%, rgba(251,191,36,.10), transparent 42%),
        linear-gradient(180deg, #05060f 0%, #0d1730 55%, #05060f 100%);
    }
    body::after {
      content: ""; position: fixed; inset: 0; z-index: -1;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: radial-gradient(circle at 50% 15%, black, transparent 72%);
      -webkit-mask-image: radial-gradient(circle at 50% 15%, black, transparent 72%);
    }
    .bg-orb { position: fixed; border-radius: 50%; filter: blur(60px); z-index: -1; pointer-events: none; animation: floatBlob 16s ease-in-out infinite; }
    .orb1 { width: 260px; height: 260px; top: -70px; left: -70px; background: radial-gradient(circle, rgba(251,191,36,.32), transparent 70%); }
    .orb2 { width: 300px; height: 300px; bottom: 80px; right: -90px; background: radial-gradient(circle, rgba(30,64,110,.5), transparent 70%); animation-delay: -6s; }
    .orb3 { width: 220px; height: 220px; top: 42%; left: 55%; background: radial-gradient(circle, rgba(251,191,36,.18), transparent 70%); animation-delay: -3s; }
    @keyframes floatBlob { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(18px,-24px) scale(1.1); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .app-shell { max-width: 440px; margin: 0 auto; width: 100%; flex: 1; display: flex; flex-direction: column; }

    .splash-header { text-align: center; margin-bottom: 34px; animation: fadeUp .5s ease; }
    .splash-icon {
      width: 62px; height: 62px; margin: 0 auto 16px; border-radius: var(--r-lg);
      background: linear-gradient(135deg, var(--gold-deep), var(--gold-bright));
      display: flex; align-items: center; justify-content: center; font-size: 1.7rem;
      box-shadow: 0 14px 30px -10px rgba(251,191,36,.45), inset 0 1px 0 rgba(255,255,255,.4);
    }
    .splash-header h1 {
      font-family: 'Sora', sans-serif; font-weight: 800; font-size: 1.28rem;
      letter-spacing: .2px; margin-bottom: 8px;
    }
    .splash-header p {
      color: var(--text-muted); font-size: 0.88rem; font-weight: 500;
    }

    .vardiya-list {
      display: flex; flex-direction: column; gap: 22px;
      flex: 1; justify-content: center;
    }

    /* Kare, yuvarlak köşeli, 3D kabarık vardiya kartı */
    .vardiya-card {
      position: relative;
      aspect-ratio: 1.55 / 1;
      border-radius: var(--r-xl);
      border: none;
      cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px;
      background: linear-gradient(160deg, #22315c 0%, #182448 55%, #0f1830 100%);
      box-shadow:
        0 22px 40px -16px rgba(0,0,0,.65),
        0 2px 0 rgba(255,255,255,.06) inset,
        0 -14px 26px -12px rgba(0,0,0,.55) inset,
        0 10px 18px -6px rgba(255,255,255,.05) inset;
      border: 1px solid rgba(255,255,255,.08);
      transition: transform .15s ease, box-shadow .15s ease;
      animation: fadeUp .55s ease both;
    }
    .vardiya-card:nth-child(2) { animation-delay: .08s; }
    .vardiya-card:active:not(.disabled) {
      transform: translateY(3px) scale(.98);
      box-shadow:
        0 10px 22px -12px rgba(0,0,0,.6),
        0 2px 0 rgba(255,255,255,.05) inset,
        0 -8px 16px -8px rgba(0,0,0,.5) inset;
    }
    .vardiya-card.gunduz {
      background: linear-gradient(160deg, #3a2f0f 0%, #2a2308 55%, #171304 100%);
    }
    .vardiya-card .saat-rozet {
      width: 58px; height: 58px; border-radius: var(--r-pill);
      background: linear-gradient(135deg, var(--gold-deep), var(--gold-bright));
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
      box-shadow:
        0 10px 20px -6px rgba(251,191,36,.5),
        inset 0 2px 3px rgba(255,255,255,.55),
        inset 0 -4px 6px rgba(120,80,0,.35);
    }
    .vardiya-card.gece .saat-rozet {
      background: linear-gradient(135deg, #1e2a52, #3a4d8f);
      box-shadow:
        0 10px 20px -6px rgba(58,77,143,.5),
        inset 0 2px 3px rgba(255,255,255,.25),
        inset 0 -4px 6px rgba(10,15,35,.5);
    }
    .vardiya-card .saat-metin {
      font-family: 'Sora', sans-serif; font-weight: 800; font-size: 1.18rem;
      letter-spacing: .3px; color: var(--text-main);
      text-shadow: 0 2px 6px rgba(0,0,0,.4);
    }
    .vardiya-card .alt-metin {
      font-size: 0.78rem; font-weight: 700; color: var(--gold-bright);
      letter-spacing: .3px; text-transform: uppercase;
    }
    .vardiya-card.gece .alt-metin { color: #9fb0e6; }

    .vardiya-card.disabled {
      cursor: default; filter: grayscale(.55) brightness(.7);
    }
    .yakinda-etiket {
      position: absolute; top: 14px; right: 14px;
      background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.15);
      border-radius: var(--r-pill); padding: 4px 10px;
      font-size: 0.62rem; font-weight: 800; letter-spacing: .4px;
      color: var(--text-muted); text-transform: uppercase;
    }

    .splash-footer {
      text-align: center; margin-top: 28px; font-size: 0.72rem;
      color: var(--text-muted); opacity: .7;
    }
  </style>
</head>
<body>
  <div class="bg-orb orb1"></div>
  <div class="bg-orb orb2"></div>
  <div class="bg-orb orb3"></div>

  <div class="app-shell">
    <div class="splash-header">
      <div class="splash-icon">🚕</div>
      <h1>Ön Ambar Mesai Çıkış Paneli</h1>
      <p>Taksi listesi oluşturmak için vardiya seçin</p>
    </div>

    <div class="vardiya-list">
      <button type="button" class="vardiya-card gunduz" onclick="vardiyaSec('08-16')">
        <div class="saat-rozet">☀️</div>
        <div class="saat-metin">08:00 – 16:00</div>
        <div class="alt-metin">Taksi Listesi Oluştur</div>
      </button>

      <button type="button" class="vardiya-card gece disabled" aria-disabled="true">
        <span class="yakinda-etiket">Yakında</span>
        <div class="saat-rozet">🌙</div>
        <div class="saat-metin">16:00 – 00:00</div>
        <div class="alt-metin">Taksi Listesi Oluştur</div>
      </button>
    </div>

    <div class="splash-footer">Vardiyanızı seçtikten sonra günlük listeyi düzenleyebilirsiniz</div>
  </div>

  <script>
    function vardiyaSec(kod) {
      window.location.href = `panel.html?vardiya=${kod}`;
    }
  </script>
</body>
</html>
